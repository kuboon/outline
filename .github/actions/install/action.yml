name: Install
description: Set up Node.js, Corepack, and install dependencies with yarn cache
runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      env:
        # Disable corepack's signature verification, which has been
        # intermittently rejecting the cached yarn binary and leaving the
        # shim returning blank from `yarn --version`. That makes
        # actions/setup-node@v5 with cache: "yarn" fail with:
        #   Could not get yarn cache folder path for undefined
        COREPACK_INTEGRITY_KEYS: "0"
      run: |
        corepack enable
        # Warm the corepack shim so setup-node's cache-folder probe sees a
        # valid version.
        yarn --version
    - name: Use Node.js 24.x
      uses: actions/setup-node@v5
      with:
        node-version: 24.x
        cache: "yarn"
    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
